<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Futures Signal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700;900&display=swap');
:root {
  --bg:#f0f4fa; --bg2:#ffffff; --bg3:#f7f9fc;
  --border:#dde4ee; --border2:#e8edf5;
  --gold:#d4920a; --green:#0a9e52; --green2:#1cb865;
  --red:#d42a42; --red2:#e85c35;
  --text:#1a2338; --muted:#7a8eaa; --dim:#a0afc0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh}

/* ── Header ── */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.header-title{font-size:14px;font-weight:900;letter-spacing:2px;color:var(--gold);font-family:'Share Tech Mono',monospace}
.live-badge{font-size:8px;background:#e8f7ee;color:var(--green);border:1px solid #b2dfc4;border-radius:3px;padding:2px 6px;letter-spacing:1px;margin-left:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.header-time{font-size:9px;color:var(--dim);text-align:right;line-height:1.7}

/* ── Nav tabs ── */
.nav{display:flex;background:var(--bg2);border-bottom:2px solid var(--border)}
.nav-btn{flex:1;background:transparent;border:none;border-bottom:3px solid transparent;padding:11px 0;font-size:11px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:var(--dim);transition:all .15s;letter-spacing:.3px}
.nav-btn.active{color:var(--gold);border-color:var(--gold)}

/* ── Controls bar ── */
.controls{background:var(--bg2);border-bottom:1px solid var(--border2);padding:8px 16px;display:flex;gap:5px;align-items:center;overflow-x:auto}
.tf-label{font-size:9px;color:var(--dim);margin-right:2px;white-space:nowrap}
.tf-btn{background:var(--bg3);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:10px;font-family:'Share Tech Mono',monospace;cursor:pointer;letter-spacing:1px;white-space:nowrap;transition:all .15s}
.tf-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:900}
.icon-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:3px 9px;font-size:9px;font-family:'Share Tech Mono',monospace;cursor:pointer;letter-spacing:1px;white-space:nowrap}
.icon-btn:active{background:var(--border)}

/* ══ PAGE A ══ */
#pageA{display:block}
#pageB{display:none}

.subtabs{display:flex;border-bottom:1px solid var(--border2);background:var(--bg2)}
.sub-btn{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 0;font-size:11px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:var(--dim);transition:all .15s}
.sub-btn[data-sub="signal"].active{color:var(--gold);border-color:var(--gold);font-weight:700}
.sub-btn[data-sub="netbuy"].active{color:var(--green);border-color:var(--green);font-weight:700}
.sub-btn[data-sub="volume"].active{color:#5577aa;border-color:#5577aa;font-weight:700}

/* col header */
.col-hdr{display:grid;grid-template-columns:22px 68px 1fr 68px 52px;gap:4px;padding:6px 16px;font-size:8px;color:var(--dim);letter-spacing:1px;border-bottom:1px solid var(--border2);font-family:'Share Tech Mono',monospace;background:var(--bg3)}
.r{text-align:right}

/* list row */
.row{display:grid;grid-template-columns:22px 68px 1fr 68px 52px;gap:4px;padding:11px 16px;border-bottom:1px solid var(--border2);align-items:center;cursor:pointer;transition:background .12s;background:var(--bg2)}
.row:active{background:#eaf0f8!important}
.row:hover{background:#f5f8fc}
.row-rank{font-size:11px;color:var(--dim);font-weight:700;font-family:'Share Tech Mono',monospace}
.row-sym{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.5px;font-family:'Share Tech Mono',monospace}
.row-sub{font-size:8px;color:var(--dim);margin-top:2px}
.bw{width:60px;height:2px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden}
.bf{height:100%;border-radius:2px}
.grade{font-size:10px;font-weight:700;letter-spacing:.5px;font-family:'Share Tech Mono',monospace}
.stags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.stag{font-size:8px;border-radius:2px;padding:1px 4px;border:1px solid;white-space:nowrap}
.row-val{text-align:right;font-size:12px;font-weight:700;font-family:'Share Tech Mono',monospace}
.row-price{text-align:right;font-size:10px;color:var(--muted);font-family:'Share Tech Mono',monospace}
.row-chg{text-align:right;font-size:10px;font-weight:700;font-family:'Share Tech Mono',monospace}

/* detail expand */
.detail{background:#eef3fa;border-bottom:1px solid var(--border);padding:12px 16px;display:none}
.detail.open{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.dcard{background:var(--bg2);border-radius:6px;padding:8px 10px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.dlabel{font-size:8px;color:var(--dim);margin-bottom:3px}
.dval{font-size:14px;font-weight:700;font-family:'Share Tech Mono',monospace}

.pbadge{display:inline-block;font-size:8px;font-family:'Share Tech Mono',monospace;border-radius:2px;padding:1px 5px;margin-top:3px;border:1px solid}
.warnbox{margin-top:10px;padding:8px 10px;background:#fff8e8;border-radius:4px;border:1px solid #f0d888;font-size:9px;color:#8a7020;line-height:1.8}

/* ══ PAGE B ══ */
.period-section{padding:14px 16px}
.period-title{font-size:11px;font-weight:900;color:var(--gold);letter-spacing:1px;margin-bottom:10px;font-family:'Share Tech Mono',monospace}
.period-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.p-btn{background:var(--bg3);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:5px 10px;font-size:10px;font-family:'Share Tech Mono',monospace;cursor:pointer;letter-spacing:.5px;transition:all .15s;white-space:nowrap}
.p-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:900}
.run-btn{background:var(--green);color:#fff;border:none;border-radius:5px;padding:10px 16px;font-size:11px;font-weight:900;font-family:'Share Tech Mono',monospace;cursor:pointer;letter-spacing:1px;width:100%;margin-top:4px;box-shadow:0 2px 8px rgba(10,158,82,.25)}
.run-btn:active{opacity:.85}
.run-btn:disabled{background:var(--dim);cursor:not-allowed;box-shadow:none}

.scards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.scard{background:var(--bg2);border-radius:8px;padding:11px 12px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.scard-label{font-size:8px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px}
.scard-val{font-size:16px;font-weight:700;font-family:'Share Tech Mono',monospace}
.scard-sub{font-size:8px;color:var(--dim);margin-top:2px}

.plist-title{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;font-family:'Share Tech Mono',monospace;margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--border2)}
.prow{display:grid;grid-template-columns:20px 1fr 90px 55px;gap:4px;padding:9px 0;border-bottom:1px solid var(--border2);align-items:center}
.prank{font-size:10px;color:var(--dim);font-weight:700;font-family:'Share Tech Mono',monospace}
.psym{font-size:13px;font-weight:700;color:var(--text);font-family:'Share Tech Mono',monospace}
.psig{font-size:9px;margin-top:2px}
.pbar{height:3px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden}
.pval{text-align:right;font-size:11px;font-weight:700;font-family:'Share Tech Mono',monospace}
.ppct{text-align:right;font-size:9px;color:var(--dim);font-family:'Share Tech Mono',monospace}

/* combo box */
.combo-box{background:linear-gradient(135deg,#e8f7ef,#f0faf4);border:1px solid #b8dfc8;border-radius:8px;padding:13px;margin-bottom:16px;box-shadow:0 2px 8px rgba(10,158,82,.08)}
.combo-title{font-size:10px;font-weight:900;color:var(--green);letter-spacing:1px;margin-bottom:8px;font-family:'Share Tech Mono',monospace}
.combo-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #cceedd}
.combo-row:last-child{border:none}
.combo-sym{font-size:13px;font-weight:700;color:var(--text);font-family:'Share Tech Mono',monospace}
.combo-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.combo-tag{font-size:8px;border-radius:2px;padding:1px 5px;border:1px solid}
.combo-right{text-align:right}
.combo-score{font-size:11px;font-weight:700;font-family:'Share Tech Mono',monospace}
.combo-net{font-size:9px;color:var(--muted);margin-top:1px;font-family:'Share Tech Mono',monospace}

/* loading */
.loading{padding:50px 20px;text-align:center}
.loading-title{color:var(--gold);font-size:13px;margin-bottom:8px}
.loading-sub{color:var(--dim);font-size:9px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.mini-spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* footer */
.footer{padding:14px 16px;border-top:1px solid var(--border);font-size:8px;color:var(--dim);line-height:2.2;background:var(--bg2)}
.footer-warn{color:#d4920a80;margin-top:4px}
.err{padding:30px 20px;text-align:center;color:var(--red);font-size:11px;line-height:1.8}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div style="display:flex;align-items:center">
    <span class="header-title">⚡ FUTURES</span>
    <span class="live-badge">LIVE</span>
  </div>
  <div class="header-time">
    <div id="lastTime">--:--:--</div>
    <div id="countdown">갱신 30s</div>
    <div id="symCount" style="color:#1a2e44">--종목</div>
  </div>
</div>

<!-- TOP NAV -->
<div class="nav">
  <button class="nav-btn active" data-page="A">🎯 실시간 신호</button>
  <button class="nav-btn"        data-page="B">📅 기간 분석</button>
</div>

<!-- SHARED TIMEFRAME CONTROLS -->
<div class="controls">
  <span class="tf-label">기준</span>
  <button class="tf-btn" data-tf="5m">5m</button>
  <button class="tf-btn active" data-tf="15m">15m</button>
  <button class="tf-btn" data-tf="1h">1h</button>
  <button class="tf-btn" data-tf="4h">4h</button>
  <button class="icon-btn" id="refreshBtn" style="margin-left:auto">↺ 새로고침</button>
</div>

<!-- ══ PAGE A ══ -->
<div id="pageA">
  <div class="subtabs">
    <button class="sub-btn active" data-sub="signal">🎯 신호</button>
    <button class="sub-btn" data-sub="netbuy">🟢 순매수</button>
    <button class="sub-btn" data-sub="volume">📊 거래량</button>
  </div>
  <div class="col-hdr">
    <span>#</span><span>종목</span><span id="colMid">신호</span>
    <span class="r">가격</span><span class="r">24H</span>
  </div>
  <div id="list"></div>
</div>

<!-- ══ PAGE B ══ -->
<div id="pageB">
  <div class="period-section">
    <div class="period-title">📅 기간별 누적 순매수</div>
    <div class="period-btns">
      <button class="p-btn active" data-tf2="5m"  data-lim="12"  data-lbl="1시간">1시간</button>
      <button class="p-btn"        data-tf2="15m" data-lim="16"  data-lbl="4시간">4시간</button>
      <button class="p-btn"        data-tf2="15m" data-lim="48"  data-lbl="12시간">12시간</button>
      <button class="p-btn"        data-tf2="15m" data-lim="96"  data-lbl="24시간">24시간</button>
      <button class="p-btn"        data-tf2="1h"  data-lim="72"  data-lbl="3일">3일</button>
      <button class="p-btn"        data-tf2="1h"  data-lim="168" data-lbl="7일">7일</button>
    </div>
    <button class="run-btn" id="runBtn">분석 시작 ▶</button>
    <div id="periodResult" style="margin-top:14px"></div>
  </div>
</div>

<div class="footer">
  <div>• 신호 점수: 매수세 + 펀딩비 + 모멘텀 + 거래량 + 변화율</div>
  <div>• 펀딩비 음수 = 숏 과열 → 롱 진입 시 펀딩 수취 유리</div>
  <div>• 기간 분석: 바이낸스 선물 캔들 Taker Buy/Sell 집계</div>
  <div>• fapi.binance.com / 30초 자동 갱신</div>
  <div class="footer-warn">⚠ 참고용 도구입니다. 투자 손실에 책임지지 않습니다.</div>
</div>

<script>
// ── 프록시 목록 (순서대로 시도) ──
const PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${url}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
];

async function fetchWithProxy(url) {
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url), { signal: AbortSignal.timeout(8000) });
      if (res.ok) return res;
    } catch {}
  }
  return null;
}

// ── 전체 바이낸스 선물 심볼 동적 로드 ──
let SYMBOLS = [];
let totalSymbolCount = 0;

async function loadSymbols() {
  try {
    const [infoRes, tickerRes] = await Promise.all([
      fetchWithProxy("https://fapi.binance.com/fapi/v1/exchangeInfo"),
      fetchWithProxy("https://fapi.binance.com/fapi/v1/ticker/24hr")
    ]);
    const info    = await infoRes.json();
    const tickers = await tickerRes.json();

    const validSet = new Set(
      info.symbols
        .filter(s => s.quoteAsset==="USDT" && s.status==="TRADING" && s.contractType==="PERPETUAL")
        .map(s => s.symbol)
    );

    // 거래량 상위 100개 (모바일 최적화, 전체 거래량의 95%+ 커버)
    SYMBOLS = tickers
      .filter(t => validSet.has(t.symbol))
      .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      
      .map(t => t.symbol);

    totalSymbolCount = SYMBOLS.length;
    return totalSymbolCount;
  } catch {
    SYMBOLS = [
      "BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT",
      "DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","DOTUSDT",
      "APTUSDT","OPUSDT","ARBUSDT","SUIUSDT","PEPEUSDT",
      "WIFUSDT","SEIUSDT","TIAUSDT","INJUSDT","STXUSDT",
      "NEARUSDT","ATOMUSDT","LTCUSDT","FILUSDT","AAVEUSDT"
    ];
    totalSymbolCount = SYMBOLS.length;
    return totalSymbolCount;
  }
}

// ── state ──
let currentTf = "15m", currentSub = "signal";
let allData = [], openSym = null;
let countdownVal = 30;
let refreshTimer = null, countdownTimer = null;
let currentPage = "A";
let pTf = "5m", pLim = 12, pLbl = "1시간";

// ── helpers ──
function fmt(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2)+"B";
  if (a >= 1e6) return (v/1e6).toFixed(1)+"M";
  if (a >= 1e3) return (v/1e3).toFixed(0)+"K";
  return v.toFixed(0);
}
function fmtP(p) {
  if (p >= 1000) return p.toLocaleString("en-US",{maximumFractionDigits:1});
  if (p >= 1)    return p.toFixed(3);
  return p.toFixed(6);
}

// ── scoring ──
function calcScore(item) {
  let s = 0; const sigs = [];
  if      (item.buyRatio >= 60) { s+=2; sigs.push({l:"강한 매수세", c:"var(--green)", i:"↑↑"}); }
  else if (item.buyRatio >= 54) { s+=1; sigs.push({l:"매수 우위",   c:"#1cb865", i:"↑"}); }
  else if (item.buyRatio <= 40) { s-=2; sigs.push({l:"강한 매도세", c:"var(--red)", i:"↓↓"}); }
  else if (item.buyRatio <= 46) { s-=1; sigs.push({l:"매도 우위",   c:"var(--red2)", i:"↓"}); }

  if      (item.fr < -0.005) { s+=2; sigs.push({l:"숏 과열(롱 유리)", c:"var(--green)", i:"💰"}); }
  else if (item.fr < -0.001) { s+=1; sigs.push({l:"음수 펀딩",       c:"#1cb865", i:"📉"}); }
  else if (item.fr >  0.01)  { s-=2; sigs.push({l:"롱 과열 주의",   c:"var(--red)", i:"🔥"}); }
  else if (item.fr >  0.005) { s-=1; sigs.push({l:"높은 펀딩비",    c:"var(--red2)", i:"⚠️"}); }

  if      (item.mom >= 2)  { s+=1; sigs.push({l:"상승 모멘텀", c:"#1cb865", i:"📈"}); }
  else if (item.mom <= -2) { s-=1; sigs.push({l:"하락 모멘텀", c:"var(--red2)", i:"📉"}); }

  if (item.vs >= 2.0) { s+=1; sigs.push({l:`거래량 ${item.vs.toFixed(1)}x`, c:"var(--gold)", i:"⚡"}); }

  if      (item.change > 5)  { s+=1; sigs.push({l:`+${item.change.toFixed(1)}% 강세`, c:"#1cb865", i:"🚀"}); }
  else if (item.change < -8) { s-=1; sigs.push({l:`${item.change.toFixed(1)}% 약세`,  c:"var(--red2)", i:"🩸"}); }

  return {score:s, sigs};
}

function gradeOf(s) {
  if (s >= 5) return {lbl:"★★★ STRONG", c:"#0a7a40", bg:"rgba(10,158,82,.07)"};
  if (s >= 3) return {lbl:"★★ WATCH",   c:"#1a9e50", bg:"rgba(26,158,80,.05)"};
  if (s >= 1) return {lbl:"★ MILD",     c:"#b07800", bg:"rgba(212,146,10,.05)"};
  if (s <=-3) return {lbl:"▼ AVOID",    c:"#c02030", bg:"rgba(212,42,66,.05)"};
  return {lbl:"— NEUTRAL", c:"#8a9ab0", bg:"transparent"};
}

// ── fetch one symbol ──
async function fetchOne(sym) {
  try {
    const [kr,tr,fr] = await Promise.all([
      fetchWithProxy(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${currentTf}&limit=20`),
      fetchWithProxy(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${sym}`),
      fetchWithProxy(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${sym}`)
    ]);
    if (!kr) return null;
    const [klines, ticker, funding] = await Promise.all([kr.json(),tr.json(),fr.json()]);

    let netBuy=0,totalVol=0,buyVol=0;
    for (const k of klines) {
      const c=parseFloat(k[4]),v=parseFloat(k[5]),bv=parseFloat(k[9]);
      netBuy+=(bv-(v-bv))*c; totalVol+=v*c; buyVol+=bv*c;
    }
    const buyRatio = totalVol>0 ? (buyVol/totalVol)*100 : 50;
    let mom=0;
    for (const k of klines.slice(-5)) { if(parseFloat(k[4])>parseFloat(k[1])) mom++; else mom--; }
    const lv = parseFloat(klines[klines.length-1][5])*parseFloat(klines[klines.length-1][4]);
    const av = klines.slice(-11,-1).reduce((s,k)=>s+parseFloat(k[5])*parseFloat(k[4]),0)/10;

    return {
      symbol: sym.replace("USDT",""),
      price: parseFloat(ticker.lastPrice),
      change: parseFloat(ticker.priceChangePercent),
      netBuyUSD: netBuy, totalVolumeUSD: totalVol,
      buyRatio, fr: parseFloat(funding.lastFundingRate||0),
      mom, vs: av>0?lv/av:1,
    };
  } catch { return null; }
}

// ── load all ──
const BATCH = 20; // 모바일 최적화: 20개씩 배치

async function loadAll() {
  document.getElementById("list").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-title">전체 시장 스캔 중...</div>
      <div class="loading-sub" id="loadSub">심볼 목록 로딩...</div>
    </div>`;

  if (SYMBOLS.length === 0) await loadSymbols();

  const sub = document.getElementById("loadSub");
  if (sub) sub.textContent = `전체 ${SYMBOLS.length}개 종목 분석 중`;

  // 배치 처리: 한꺼번에 300개+ 요청 시 일부 실패 방지
  let all = [];
  for (let i = 0; i < SYMBOLS.length; i += BATCH) {
    const batch = SYMBOLS.slice(i, i + BATCH);
    const res = await Promise.all(batch.map(fetchOne));
    all = all.concat(res.filter(Boolean));
    if (sub) sub.textContent = `${Math.min(i+BATCH, SYMBOLS.length)} / ${SYMBOLS.length} 분석 중...`;
  }

  const valid = all.map(item => ({...item, ...calcScore(item)}));

  if (!valid.length) {
    document.getElementById("list").innerHTML = `
      <div class="err">⚠️ API 연결 실패<br>
      <span style="font-size:10px;color:#3a5070">크롬 브라우저에서 열어주세요</span></div>`;
    return;
  }
  allData = valid;
  openSym = null;
  document.getElementById("lastTime").textContent = new Date().toLocaleTimeString();
  // 헤더에 총 종목 수 표시
  document.getElementById("symCount").textContent = `${valid.length}종목`;
  renderList();
}

// ── render list ──
function renderList() {
  const sorted = [...allData].sort((a,b)=>{
    if (currentSub==="signal") return b.score-a.score;
    if (currentSub==="netbuy") return b.netBuyUSD-a.netBuyUSD;
    return b.totalVolumeUSD-a.totalVolumeUSD;
  });

  document.getElementById("colMid").textContent =
    currentSub==="signal" ? "신호" : currentSub==="netbuy" ? "순매수(USD)" : "거래량(USD)";

  let html="";
  sorted.forEach((item,i)=>{
    const g = gradeOf(item.score);
    const chgC = item.change>=0 ? "var(--green)" : "var(--red)";
    const barC = item.buyRatio>=50 ? "var(--green)" : "var(--red)";
    const isOpen = openSym===item.symbol;

    // mid cell
    let mid="";
    if (currentSub==="signal") {
      const tags = item.sigs.slice(0,2).map(s=>
        `<span class="stag" style="color:${s.c};border-color:${s.c}30;background:${s.c}10">${s.i} ${s.l}</span>`
      ).join("");
      mid=`<div><span class="grade" style="color:${g.c}">${g.lbl}</span><div class="stags">${tags}</div></div>`;
    } else {
      const v = currentSub==="netbuy" ? item.netBuyUSD : item.totalVolumeUSD;
      const vc = currentSub==="netbuy" ? (v>=0?"var(--green)":"var(--red)") : "var(--gold)";
      mid=`<div class="row-val" style="color:${vc}">${currentSub==="netbuy"&&v>=0?"+":""}${fmt(v)}</div>`;
    }

    // detail cards
    const fundC = item.fr<0?"var(--green)":item.fr>0.008?"var(--red)":"#3a5070";
    const momT  = item.mom>=0?`상승 ${item.mom}/5`:`하락 ${Math.abs(item.mom)}/5`;
    const sC    = item.score>=3?"var(--green)":item.score<=-2?"var(--red)":"var(--gold)";
    const allS  = item.sigs.map(s=>`<span style="color:${s.c};margin-right:5px">${s.i} ${s.l}</span>`).join("");
    const dcards = [
      {l:"매수 비율", v:`${item.buyRatio.toFixed(1)}%`,         c:item.buyRatio>=50?"var(--green)":"var(--red)"},
      {l:"펀딩비",   v:`${(item.fr*100).toFixed(4)}%`,          c:fundC},
      {l:"순매수",   v:fmt(item.netBuyUSD),                     c:item.netBuyUSD>=0?"var(--green)":"var(--red)"},
      {l:"거래량급증",v:`${item.vs.toFixed(2)}x`,               c:item.vs>=2?"var(--gold)":"#3a5070"},
      {l:"모멘텀",   v:momT,                                     c:item.mom>=0?"var(--green)":"var(--red)"},
      {l:"종합점수", v:`${item.score>0?"+":""}${item.score}`,   c:sC},
    ].map(c=>`<div class="dcard"><div class="dlabel">${c.l}</div><div class="dval" style="color:${c.c}">${c.v}</div></div>`).join("");

    html+=`
      <div class="row" style="background:${isOpen?"#e8f0fa":g.bg}" onclick="toggleDetail('${item.symbol}')">
        <span class="row-rank">${i+1}</span>
        <div>
          <div class="row-sym">${item.symbol}</div>
          <div class="row-sub">${item.buyRatio.toFixed(0)}%매수</div>
          <div class="bw"><div class="bf" style="width:${Math.min(100,Math.max(0,item.buyRatio))}%;background:${barC}"></div></div>
        </div>
        ${mid}
        <div class="row-price">${fmtP(item.price)}</div>
        <div class="row-chg" style="color:${chgC}">${item.change>=0?"+":""}${item.change.toFixed(2)}%</div>
      </div>
      <div class="detail ${isOpen?"open":""}" id="d-${item.symbol}">
        <div class="dgrid">${dcards}</div>
        <div style="font-size:8px;color:var(--dim);line-height:2">전체 신호: ${allS||'<span style="color:#1a2e44">신호 없음</span>'}</div>
        <div class="warnbox">⚠️ 참고용 신호입니다. 손절가를 먼저 정하세요.</div>
      </div>`;
  });
  document.getElementById("list").innerHTML = html;
}

function toggleDetail(sym) {
  openSym = openSym===sym ? null : sym;
  renderList();
}

// ── countdown / refresh ──
function startCountdown() {
  clearInterval(countdownTimer);
  countdownVal = 30;
  countdownTimer = setInterval(()=>{
    countdownVal = Math.max(0,countdownVal-1);
    document.getElementById("countdown").textContent = `갱신 ${countdownVal}s`;
  },1000);
}
function startCycle() {
  clearInterval(refreshTimer);
  loadAll(); startCountdown();
  refreshTimer = setInterval(()=>{ loadAll(); startCountdown(); },30000);
}

// ── PAGE B: period analysis ──
async function fetchPeriod(sym) {
  try {
    const res = await fetchWithProxy(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${pTf}&limit=${pLim}`);
    if (!res) return null;
    const klines = await res.json();
    let netBuy=0,totalVol=0,buyVol=0;
    for (const k of klines) {
      const c=parseFloat(k[4]),v=parseFloat(k[5]),bv=parseFloat(k[9]);
      netBuy+=(bv-(v-bv))*c; totalVol+=v*c; buyVol+=bv*c;
    }
    return { symbol:sym.replace("USDT",""), netBuyUSD:netBuy, totalVolumeUSD:totalVol,
      buyRatio: totalVol>0?(buyVol/totalVol)*100:50 };
  } catch { return null; }
}

async function runPeriod() {
  const btn = document.getElementById("runBtn");
  btn.disabled=true; btn.textContent="분석 중...";
  document.getElementById("periodResult").innerHTML=`
    <div style="padding:20px;text-align:center">
      <div class="mini-spinner"></div>
      <div style="color:var(--dim);font-size:10px" id="pLoadSub">전체 ${SYMBOLS.length}개 종목 × ${pLbl} 집계 중</div>
    </div>`;

  // 배치 처리
  let all = [];
  for (let i = 0; i < SYMBOLS.length; i += BATCH) {
    const batch = SYMBOLS.slice(i, i + BATCH);
    const res = await Promise.all(batch.map(fetchPeriod));
    all = all.concat(res.filter(Boolean));
    const sub = document.getElementById("pLoadSub");
    if (sub) sub.textContent = `${Math.min(i+BATCH, SYMBOLS.length)} / ${SYMBOLS.length} 집계 중...`;
  }
  const valid = all;

  btn.disabled=false; btn.textContent="분석 시작 ▶";

  if (!valid.length) {
    document.getElementById("periodResult").innerHTML=`<div style="color:var(--red);font-size:10px;padding:10px 0">API 연결 실패</div>`;
    return;
  }

  const totalNet  = valid.reduce((s,d)=>s+d.netBuyUSD,0);
  const totalSell = valid.reduce((s,d)=>s+Math.min(0,d.netBuyUSD),0);
  const totalVol  = valid.reduce((s,d)=>s+d.totalVolumeUSD,0);
  const buyCount  = valid.filter(d=>d.netBuyUSD>0).length;
  const sellCount = valid.filter(d=>d.netBuyUSD<0).length;
  const maxAbs    = Math.max(...valid.map(d=>Math.abs(d.netBuyUSD)));

  const top5buy  = [...valid].sort((a,b)=>b.netBuyUSD-a.netBuyUSD).slice(0,5);
  const top5sell = [...valid].sort((a,b)=>a.netBuyUSD-b.netBuyUSD).slice(0,5);

  // find coins that are BOTH top period buy AND high signal score
  const signalMap = {};
  allData.forEach(d => signalMap[d.symbol] = d);
  const combo = top5buy
    .map(d => ({...d, sig: signalMap[d.symbol]}))
    .filter(d => d.sig && d.sig.score >= 2)
    .sort((a,b) => b.sig.score - a.sig.score);

  function prows(list, isPos) {
    return list.map((d,i)=>{
      const col = isPos?"var(--green)":"var(--red)";
      const bw  = maxAbs>0 ? Math.abs(d.netBuyUSD)/maxAbs*100 : 0;
      const pct = totalVol>0 ? (Math.abs(d.netBuyUSD)/totalVol*100).toFixed(2) : "0";
      // signal badge
      const sig = signalMap[d.symbol];
      let sigBadge = "";
      if (sig) {
        const g = gradeOf(sig.score);
        sigBadge = `<span class="psig" style="color:${g.c}">${g.lbl}</span>`;
      }
      return `
        <div class="prow">
          <span class="prank">${i+1}</span>
          <div>
            <div class="psym">${d.symbol}</div>
            ${sigBadge}
            <div class="pbar"><div style="height:100%;width:${bw}%;background:${col};border-radius:2px"></div></div>
          </div>
          <div class="pval" style="color:${col}">${isPos?"+":""}${fmt(d.netBuyUSD)}</div>
          <div class="ppct">${pct}%</div>
        </div>`;
    }).join("");
  }

  // combo box HTML
  let comboHtml = "";
  if (combo.length > 0) {
    const rows = combo.map(d=>{
      const g = gradeOf(d.sig.score);
      const tags = d.sig.sigs.slice(0,3).map(s=>
        `<span class="combo-tag" style="color:${s.c};border-color:${s.c}30;background:${s.c}10">${s.i} ${s.l}</span>`
      ).join("");
      return `
        <div class="combo-row">
          <div>
            <div class="combo-sym">${d.symbol}</div>
            <div class="combo-tags">${tags}</div>
          </div>
          <div class="combo-right">
            <div class="combo-score" style="color:${g.c}">${g.lbl}</div>
            <div class="combo-net" style="color:var(--green)">+${fmt(d.netBuyUSD)}</div>
          </div>
        </div>`;
    }).join("");
    comboHtml = `
      <div class="combo-box">
        <div class="combo-title">🔥 기간 순매수 + 실시간 신호 동시 해당</div>
        <div style="font-size:9px;color:var(--dim);margin-bottom:8px">${pLbl} 순매수 상위 + 현재 신호 ★★ 이상 종목</div>
        ${rows}
      </div>`;
  }

  document.getElementById("periodResult").innerHTML = `
    ${comboHtml}
    <div class="scards">
      <div class="scard">
        <div class="scard-label">기간 순매수 합계</div>
        <div class="scard-val" style="color:var(--green)">${totalNet>=0?"+":""}${fmt(totalNet)}</div>
        <div class="scard-sub">매수우위 ${buyCount}개 종목</div>
      </div>
      <div class="scard">
        <div class="scard-label">기간 순매도 합계</div>
        <div class="scard-val" style="color:var(--red)">${fmt(totalSell)}</div>
        <div class="scard-sub">매도우위 ${sellCount}개 종목</div>
      </div>
      <div class="scard">
        <div class="scard-label">전체 거래량</div>
        <div class="scard-val" style="color:var(--gold)">${fmt(totalVol)}</div>
        <div class="scard-sub">${pLbl} 누적</div>
      </div>
      <div class="scard">
        <div class="scard-label">시장 매수세</div>
        <div class="scard-val" style="color:${buyCount>sellCount?"var(--green)":"var(--red)"}">${((buyCount/valid.length)*100).toFixed(0)}%</div>
        <div class="scard-sub">종목 기준</div>
      </div>
    </div>
    <div class="plist-title">🟢 순매수 TOP 5 — ${pLbl}</div>
    ${prows(top5buy,true)}
    <div class="plist-title">🔴 순매도 TOP 5 — ${pLbl}</div>
    ${prows(top5sell,false)}
  `;
}

// ── event listeners ──
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentPage = btn.dataset.page;
    document.getElementById("pageA").style.display = currentPage==="A"?"block":"none";
    document.getElementById("pageB").style.display = currentPage==="B"?"block":"none";
  });
});

document.querySelectorAll(".tf-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tf-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentTf = btn.dataset.tf;
    startCycle();
  });
});

document.querySelectorAll(".sub-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".sub-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentSub = btn.dataset.sub;
    if (allData.length>0) renderList();
  });
});

document.querySelectorAll(".p-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".p-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    pTf  = btn.dataset.tf2;
    pLim = parseInt(btn.dataset.lim);
    pLbl = btn.dataset.lbl;
  });
});

document.getElementById("refreshBtn").addEventListener("click", startCycle);
document.getElementById("runBtn").addEventListener("click", runPeriod);

// ── init ──
(async () => {
  await loadSymbols();
  startCycle();
})();
</script>
